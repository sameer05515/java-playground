<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhagavad Gita, The Song of God</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="icon" th:href="@{/data/images/smbg_header_logo.png}"></head><body><div class="container-fluid"><div class="container"><div class="row"><div class="col-sm-12 headingBg"><div><span th:text="${verse.verseHeader}"></span> : (<span th:text="${chapter.chapterSubTitleForChapterPage}"></span>)</div><div class="text-center nav-row"><a th:href="@{/}"><b>HOME</b></a></div><div class="row nav-row"><div class="col-xs-6"><a th:href="${chapter.previousChapterUrl.replace('#','')}"><b>Previous Chapter</b></a></div><div class="col-xs-6 text-right"><a th:href="${chapter.nextChapterUrl.replace('#','')}"><b>Next Chapter</b></a></div></div><div class="row nav-row"><div class="col-xs-6"><a th:href="${verse.previousVerseUrl.replace('#','')}"><b>Previous</b></a></div><div class="col-xs-6 text-right"><a th:href="${verse.nextVerseUrl.replace('#','')}"><b>Next</b></a></div></div></div><div class="col-sm-6"><div th:each="s:${verse.shlok}" class="shlok" th:text="${s.value}"></div><div th:each="s:${verse.shlokEng}" class="shlok" th:text="${s.value}"></div></div><div class="col-sm-6 text-center"><audio controls controlslist="nodownload" style="max-width:100%" th:if="${verse.shlokPath != null}" th:src="@{${'/' + verse.shlokPath}}">Audio not supported</audio></div><div class="col-sm-12"><div th:if="${verse.meaning.size()>0}"><br><b>Meaning :</b><br></div><span th:each="m:${verse.meaning}" class="verse-meaning"><a th:href="${m.wordMeaningDetailUrl.replace('#','')}" th:text="${m.sanskrit}"></a> -- <span th:text="${m.meaning}"></span>, </span><div th:if="${verse.translation.size()>0}"><br><b>Translation :</b><br></div><div th:each="t:${verse.translation}" class="verse-meaning"><b th:text="${t.header}"></b> -- <span th:text="${t.value}"></span></div><div th:if="${verse.commentary.size()>0}"><br><b>Commentary :</b><br></div><div th:each="c:${verse.commentary}" class="commentary"><div th:if="${!c.isShlokCommentary}" th:text="${c.value}"></div><div th:if="${c.isShlokCommentary}" class="commentary-shlok" th:text="${c.value}"></div></div></div></div></div></div><script src="https://code.jquery.com/jquery-1.11.3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js"></script></body></html>
