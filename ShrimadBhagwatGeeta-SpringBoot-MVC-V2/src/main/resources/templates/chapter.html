<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhagavad Gita, The Song of God</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="icon" th:href="@{/data/images/smbg_header_logo.png}"></head><body><div class="container-fluid"><div class="container"><div class="row"><div class="col-sm-12 headingBg"><div>Bhagavad Gita : <span th:text="${chapter.chapterTitleForChapterPage}"></span> (<span th:text="${chapter.chapterSubTitleForChapterPage}"></span>)</div><div class="text-center nav-row"><a th:href="@{/}"><b>HOME</b></a></div><div class="row nav-row"><div class="col-xs-6"><a th:href="${chapter.previousChapterUrl.replace('#','')}"><b>Previous Chapter</b></a></div><div class="col-xs-6 text-right"><a th:href="${chapter.nextChapterUrl.replace('#','')}"><b>Next Chapter</b></a></div></div></div><div class="col-sm-12"><p th:each="d:${chapter.description}" th:text="${d}"></p></div><div th:each="v:${chapter.verses}" class="col-sm-12 panel panel-default"><div class="panel-heading"><a th:href="${v.currentVerseUrl.replace('#','')}"><b th:text="${v.verseHeader}"></b></a></div><div class="panel-body"><div th:each="s:${v.shlok}" class="shlok" th:text="${s.value}"></div><div th:text="${v.oneLiner}"></div></div></div></div></div></div><script src="https://code.jquery.com/jquery-1.11.3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js"></script></body></html>
